<header class="app-header">
  <div>
    <h1>SettleTrack</h1>
    <p>Securities settlement tracker</p>
  </div>
  <button type="button" (click)="refresh()" [disabled]="loading()">Refresh</button>
</header>

<main>
  <app-summary-cards [summary]="summary()" />

  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }

  <details class="new-trade">
    <summary>New trade</summary>
    <app-trade-form [busy]="creating()" (submitted)="createTrade($event)" />
  </details>

  <section class="filters">
    <label>
      Status
      <select (change)="setStatusFilter($any($event.target).value)">
        <option value="">All</option>
        @for (status of statuses; track status) {
          <option [value]="status">{{ status }}</option>
        }
      </select>
    </label>
    <label>
      ISIN
      <input
        type="text"
        placeholder="e.g. US03"
        [value]="isinFilter()"
        (change)="setIsinFilter($any($event.target).value)"
      />
    </label>
  </section>

  @if (loading()) {
    <p class="muted">Loading…</p>
  }

  <app-trade-table [trades]="trades()" [busyId]="busyId()" (statusChange)="changeStatus($event)" />
</main>
