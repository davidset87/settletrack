name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'settletrack-frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'settletrack-frontend/**'

defaults:
  run:
    working-directory: settletrack-frontend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: settletrack-frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npx ng test --no-watch

      - name: Production build
        run: npx ng build